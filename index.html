<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Traffico</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #f2efe8;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      /* Niente scroll, zoom o menu del browser mentre si disegna. */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: center;
      gap: 24px;
      font-family: system-ui, sans-serif;
      color: #3d4047;
      pointer-events: none; /* i tocchi passano al canvas */
      user-select: none;
      -webkit-user-select: none;
    }
    .hud-item { text-align: center; min-width: 56px; }
    .hud-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .hud-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
