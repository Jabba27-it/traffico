<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Traffico</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #f2efe8;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      /* Niente scroll, zoom o menu del browser mentre si disegna. */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: center;
      gap: 24px;
      font-family: system-ui, sans-serif;
      color: #3d4047;
      pointer-events: none; /* i tocchi passano al canvas */
      user-select: none;
      -webkit-user-select: none;
    }
    .hud-item { text-align: center; min-width: 56px; }
    .hud-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .hud-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; }
    .game-over {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(242, 239, 232, 0.75);
      font-family: system-ui, sans-serif;
      color: #3d4047;
    }
    .game-over-box {
      width: 100%;
      max-width: 320px;
      padding: 24px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      text-align: center;
    }
    .game-over h1 { margin: 0 0 8px; font-size: 24px; }
    .game-over p { margin: 0 0 20px; font-size: 14px; opacity: 0.75; }
    .game-over-stats { display: flex; justify-content: space-around; margin-bottom: 24px; }
    .game-over button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #3d4047;
      color: #ffffff;
      font: 600 17px system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
